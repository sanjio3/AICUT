# AICUT 唯一用户入口。所有路径支持 ${ENV_VAR:-默认值} 展开，仓库内不写本机绝对路径。
# 本机跑验证时用环境变量覆盖：AICUT_FFMPEG / AICUT_VIDEOS / AICUT_OVERLAYS / AICUT_BGM / AICUT_MUSIC_JSON
version: 1

# 用户点名哪几个特效，就只轮替哪几个。留空走内置默认轮替。
# 根 SKILL.md 路由命中的结果由 `aicut.py plan --effects ...` 写进 runs/<id>/params.yaml 的 selection 段。
selection:
  effects: []

paths:
  ffmpeg: "${AICUT_FFMPEG:-ffmpeg}"
  materials: "${AICUT_MATERIALS:-./materials}"
  videos: "${AICUT_VIDEOS:-./materials/videos}"
  overlays: "${AICUT_OVERLAYS:-./materials/overlays}"
  bgm: "${AICUT_BGM:-./materials/bgm.mp4}"
  music_json: "${AICUT_MUSIC_JSON:-./materials/music.json}"
  runs: "./runs"
  output: "./runs/latest.mp4"

project:
  width: 1280
  height: 720
  fps: 24
  duration: 48.0
  m0: 149.19            # BGM 入点（秒），由 music.json 的 sections + energy 自动校准前优先用此值
  drop_at: 3.81         # 前奏长度（秒）
  bpm_fallback: 129.2   # 连 BGM 都没有时等距网格兜底用的 BPM，不再是代码里的隐藏常量
  workers: 6
  crf: 13
  preset: medium

# 全局可调旋钮。每个键带 default / min / max / step / affects / note。
# affects 指向 qa.py 输出的指标名，用于归因与 diff。
effects:
  card:
    shake_hz:
      default: 0.14
      min: 0
      max: 5
      step: 0.02
      affects: [dup_pct]
      note: "大于 2Hz 会被判为晃。降低抖动必须同步加大 push_px，否则重复帧从 0.3% 涨到 13.4%"
    push_px:
      default: 22
      min: 0
      max: 60
      step: 2
      affects: [dup_pct, motion_p50]
      note: "25fps 素材转 24fps 本就重复约 4%，靠每帧改裁切位置盖住"
    contrast:
      default: 1.13
      min: 0.9
      max: 1.6
      step: 0.02
      affects: [V]
  pool:
    dhash_th:
      default: 4
      min: 0
      max: 12
      step: 1
      affects: [repeat_ratio]
      note: "汉明距离阈值，越小去重越狠；找不到素材时按 4→8→12 三级降级"
    quota:
      default: 6
      min: 1
      max: 20
      step: 1
      affects: [repeat_ratio]
      note: "小素材每个用满配额才回落到长素材，长素材占比曾高达 72.2%"
    motion_min:
      default: 1.2
      min: 0
      max: 4
      step: 0.1
      affects: [dark_pct, motion_p50]
  ending-dissolve:
    gblur_sigma:
      default: 8
      min: 0
      max: 20
      step: 1
      affects: [laplacian_var, V]
      note: "sigma=20 时太模糊看不出内容；Laplacian 方差是清晰度的代理指标"
    dissolve_frames:
      default: 96
      min: 24
      max: 192
      step: 8
      affects: [cut_rate, motion_p90]
      note: "硬切加模糊不等于连续变换；96 帧交叉溶解把帧差 p90 从 45.7 降到 15.7"

# 用户口语 → 参数路径。AI 收到反馈先查这里，不要凭感觉改代码。
attribution:
  - say: ["太晃", "一直晃", "画面抖", "开头晃"]
    params: [card.shake_hz, card.push_px]
    hint: "降抖动后必须复测 dup_pct，必要时把 push_px 加到 22"
  - say: ["素材重复", "老是那几个", "不够的从长素材取"]
    params: [pool.dhash_th, pool.quota]
    hint: "先看 repeat_ratio，再决定放宽去重还是提高配额"
  - say: ["太模糊", "看不出是什么", "糊成一团"]
    params: [ending-dissolve.gblur_sigma]
    hint: "用 laplacian_var 复核，不要只看 V"
  - say: ["一下一下闪", "看不出连续感", "不够顺"]
    params: [ending-dissolve.dissolve_frames]
    hint: "检查 cut_rate 是否降到 0，motion_p90 是否稳定"
  - say: ["火焰看不清", "火焰太暗", "火焰过曝"]
    params: [fire-transition.base_dim, fire-transition.flame_gain]
    hint: "逐平面 blend，不要用 all_mode=screen"
  - say: ["卡点不准", "切点没踩上"]
    params: [project.m0, project.drop_at]
    hint: "渲后回测每个切点距最近拍点的帧差，阈值 3 帧；m0 是 BGM 入点"

# gate 只报警不自动回退。主观审美仍需人工看片。
gates:
  dark_pct_max: 2.0
  bright_pct_max: 8.0
  dup_pct_max: 6.0
  beat_error_frames_max: 3
  repeat_ratio_max: 0.60
