# manga-split local defaults. 0.1.0 is the regular four-panel split; the
# irregular slanted mask from the reference cut is not migrated yet.
cells:
  default: 4
  locked: true
  note: "The implementation is fixed at four panels; irregular panels need a pre-generated mask sequence, which is the next stage"
mono_sat:
  default: 0.05
  min: 0
  max: 1
  step: 0.05
  affects: [V, laplacian_var]
  note: "Saturation of the black and white panels; the lower it is the more comic the frame reads"
color_sat:
  default: 1.40
  min: 0.5
  max: 2.5
  step: 0.05
  affects: [V]
  note: "Saturation of the colour panels; one colour and one monochrome pair creates the contrast"
contrast:
  default: 1.25
  min: 0.9
  max: 2.0
  step: 0.02
  affects: [V, dark_pct]
  note: "Contrast shared by all four panels"
beat_align:
  default: true
  affects: [cut_rate]
  note: "Consumed by lib/plan.py"
