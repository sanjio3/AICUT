# fire-transition local defaults. Groups with the same name in the global
# params.yaml are merged, and the local value wins.
clip:
  default: fire01
  values: [fire01, fire02]
  affects: [shape]
  note: "Which of the fire overlays discovered by prepare to use; decides the flame shape"
trim_start:
  default: 0.55
  min: 0
  max: 1.50
  step: 0.05
  affects: [dark_pct]
  note: "Where in the flame clip to start. Too early lands on black frames; 0.55 is the measured working start"
base_dim:
  default: 0.68
  min: 0.40
  max: 1.00
  step: 0.02
  affects: [V, dark_pct]
  note: "How much the base plate is dimmed; without dimming the flame does not read"
flame_gain:
  default: 1.95
  min: 0.80
  max: 2.60
  step: 0.05
  affects: [bright_pct]
  note: "Flame brightness gain; above 2.4 it blows out easily"
chroma_mix:
  default: 0.28
  min: 0
  max: 1
  step: 0.02
  affects: [V]
  note: "Share of the flame in the chroma planes; changes U/V only, not brightness"
beat_align:
  default: true
  affects: [cut_rate]
  note: "Consumed by lib/plan.py; decides whether cuts snap to the nearest beat"
hue:
  default: 6.0
  locked: true
  note: "Locked. Rotating hue on fire shots turns orange into purple, which stops reading as fire"
