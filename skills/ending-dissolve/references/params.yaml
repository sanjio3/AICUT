# ending-dissolve local defaults. gblur_sigma and dissolve_frames are defined
# in the same groups of the global params.yaml; the two keys below merge with
# the global groups and do not override them.
gamma:
  default: 0.68
  min: 0.40
  max: 1.00
  step: 0.02
  affects: [V, dark_pct]
  note: "Dimming factor; 0.68 is what came out of the reference request to dim by 1.5x"
mix:
  default: 0.28
  min: 0
  max: 0.60
  step: 0.02
  affects: [motion_p90, laplacian_var]
  note: "Share of the second blur layer in the blend; the higher it is the softer the result"
