name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: smoke and validate (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 has no prebuilt interpreter for ubuntu-26.04, which is
        # what the hosted runners ship now, so that combination is pinned to
        # an older image. Everything else uses the current one.
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all sources
        run: python -m compileall -q aicut.py install.py lib skills tests examples

      - name: Run the smoke test
        run: python tests/smoke.py

      - name: Validate every skill
        run: python aicut.py validate-effect --all

      - name: Package every skill
        run: python aicut.py package

      - name: Install the skills into a scratch directory
        run: python aicut.py install --project "$RUNNER_TEMP/aicut-project"

  no-secrets:
    name: no local paths or secrets in tracked files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Scan for local paths, credentials and stray media
        run: |
          set -e
          # The credential patterns look for a hardcoded literal, not for the
          # word itself. Code that reads a credential mentions "password="
          # while parsing it, and that is not a leak. The pattern requires a
          # quoted string or a known token prefix.
          #
          # The pattern is verified by tools/posix_ere_test.py, which runs this
          # same git grep against probe files. Do not change it without
          # running that first: a pattern that matches nothing looks exactly
          # like a clean tree.
          if git grep -niE '(C:\\\\Users|/Users/|/home/[a-z]|AppData|BEGIN [A-Z ]*PRIVATE KEY|(ghp_|gho_|ghu_|ghs_|ghr_|github_pat_|glpat-|xox[baprs]-|sk-[A-Za-z0-9]|AKIA|AIza|ASIA)[A-Za-z0-9_+./-]{10,}|(password|passwd|secret|token|api[_-]?key|credential|auth)[a-zA-Z_-]*[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"'\s]{8,}["'"'"'])' -- . \
             ':(exclude)docs/demo/*' ':(exclude).github/workflows/*' \
             ':(exclude)tools/posix_ere_test.py' \
             ':(exclude)tools/check_secret_scan.py'; then
            echo "::error::found a local path or a credential-like string"
            exit 1
          fi
          echo "clean"

      - name: Check the secret scan still catches a real leak
        run: bash tools/check_secret_scan.py

      - name: Verify no media files are tracked
        run: |
          set -e
          tracked=$(git ls-files '*.mp4' '*.mov' '*.mkv' '*.webm' | grep -v '^docs/demo/' || true)
          if [ -n "$tracked" ]; then
            echo "::error::media files are tracked outside docs/demo:"
            echo "$tracked"
            exit 1
          fi
          echo "clean"
